# Tier 1 — laboratorio web: statici puri + reverse proxy /api/* (D2).
#
# Montato in nginx:alpine come /etc/nginx/conf.d/default.conf; la root punta
# alla bind mount di diariobot/web/static. Same-origin: la pagina chiama solo
# /api/* relativi e nginx li inoltra al gateway → niente CORS.
# La responsabilità di questo tier è SOLO la presentazione: nessun parametro
# del modello, nessuno stato (normalizzazione e osservabilità sono nel gateway).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Business logic -> gateway (tier 2). Gli header X-Client-Id / X-Step
    # passano integralmente (default di proxy_pass), per l'osservabilità.
    location /api/ {
        proxy_pass http://gateway:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # il modello reale può impiegare qualche secondo (come l'adapter: 120s)
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Pannello educatore (asset statico, i dati arrivano da /api/sessions)
    location = /admin {
        try_files /admin.html =404;
    }

    # Favicon: SVG statico (parità col vecchio server stdlib inline)
    location = /favicon.ico {
        default_type image/svg+xml;
        alias /usr/share/nginx/html/favicon.svg;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
