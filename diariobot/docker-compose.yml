# DiarioBot — topologia a 3 tier (mini PC, oppure Pi 3 come host — vedi override).
#   tier 1  web     = nginx: statici puri (pagina/admin) + reverse proxy /api/*
#   tier 2  gateway = business logic (proxy skill, chat normalizzata, model-status,
#                     osservabilità) — unico processo Python, non serve statici
#   tier 3  llama   = inferenza (API compatibile OpenAI)
# Il servizio `skill` è il cervello di "diario-di-bordo" (invariato). La CLI
# gira sui Pi e punta a `:8080` (skill).
#
# Uso (backend "auto" nella skill: prova llama, fallback mock — niente env da impostare):
#   demo (mock, senza modello):   docker compose up
#   tutto reale (con modello):    MODEL_FILE=qwen2.5-1.5b-instruct-q4_k_m.gguf \
#                                 docker compose --profile model up
#   (forza un backend specifico con DIARIOBOT_BACKEND=mock|llama|auto)
#
# Topologia di campo: host (mini PC o Pi 3, vedi docker-compose.pi.yml) = questi
# service; i client (browser kiosk / CLI) puntano a http://<host>:8090 (pagina)
# o http://<host>:8080 (CLI --remote).
#
# Nota: il download del GGUF va fatto dove c'è rete (lo spike vivo è rimandato
# a un ambiente con connettività — vedi README "Avvio con modello reale").

services:
  web:
    image: nginx:alpine           # tier 1: solo presentazione (~5 MB)
    ports:
      - "8090:80"                 # unico punto d'ingresso per la pagina
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./diariobot/web/static:/usr/share/nginx/html:ro
    depends_on:
      - gateway

  gateway:
    build: .
    # nessuna porta pubblicata: la pagina passa da nginx (same-origin /api/*)
    environment:
      SKILL_URL: http://skill:8080
      LLAMA_URL: http://llama:8081
      GATEWAY_PORT: "8090"
      # Osservabilità: sessioni (JSONL) persistite nel volume; verbose OFF (privacy).
      LAB_SESSIONS_DIR: /app/sessions
      LAB_LOG_VERBOSE: ${LAB_LOG_VERBOSE:-0}
    volumes:
      - ./sessions:/app/sessions   # persistenza sessioni tra riavvii (debug a posteriori)
    command: ["python3", "-m", "diariobot.gateway"]
    depends_on:
      - skill

  skill:
    build: .
    ports:
      - "8080:8080"
    environment:
      # auto: usa llama se è attivo (--profile model), altrimenti mock.
      # Così basta `docker compose up` (demo) o `--profile model up` (reale).
      DIARIOBOT_BACKEND: ${DIARIOBOT_BACKEND:-auto}
      LLAMA_URL: http://llama:8081
      DIARIOBOT_PORT: "8080"
    depends_on:
      llama:
        condition: service_healthy
        required: false   # il servizio skill parte anche senza llama (backend mock)

  llama:
    image: ghcr.io/ggml-org/llama.cpp:server
    profiles: ["model"]          # attivo solo con --profile model
    ports:
      # DECISIONE DICHIARATA (D3): 8081 è pubblicata in LAN per **consumer
      # fidati** (CLI, debug, sviluppo) che parlano OpenAI-compat diretto.
      # Non è un vincolo di rete: è una convenzione dell'applicazione — la
      # pagina del laboratorio usa SOLO il gateway (:8090/api/*), dove vivono
      # normalizzazione e osservabilità; chi bypassa le perde (LAN offline
      # fidata, niente auth).
      - "8081:8081"
    volumes:
      - ./models:/models:ro
    # Nessun --grammar-file globale: la grammatica arriva PER-REQUEST dalla skill
    # (campo "grammar" nel body). Una grammatica globale vincolerebbe anche le
    # chat libere delle tappe 1/2/4 (/api/chat) a JSON, rompendole.
    command: >
      -m /models/${MODEL_FILE:-qwen2.5-0.5b-instruct-q4_k_m.gguf}
      --host 0.0.0.0 --port 8081
      -t 4 -c 2048 --temp 0.2
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
