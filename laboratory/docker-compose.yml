# Laboratorio — topologia a 3 tier (mini PC, oppure Pi 3 come host — vedi override).
#   tier 1  web     = nginx: statici puri (pagina/admin) + reverse proxy /api/*
#   tier 2  gateway = business logic (proxy skill, chat normalizzata, model-status,
#                     osservabilità) — unico processo Python, non serve statici
#   tier 3  llama   = inferenza (API compatibile OpenAI)
# Il servizio `skill` è il cervello di "diario-di-bordo" (invariato). La CLI
# gira sui Pi e punta a `:8080` (skill).
#
# Uso (backend "auto" nella skill: prova llama, fallback mock — niente env da impostare):
#   demo (mock, senza modello):   docker compose up
#   tutto reale (con modello):    MODEL_FILE=qwen2.5-1.5b-instruct-q4_k_m.gguf \
#                                 docker compose --profile model up
#   (forza un backend specifico con LAB_BACKEND=mock|llama|auto)
#
# Topologia di campo: host (mini PC o Pi 3, vedi docker-compose.pi.yml) = questi
# service; i client (browser kiosk / CLI) puntano a http://<host>:8090 (pagina)
# o http://<host>:8080 (CLI --remote).
#
# Nota: il download del GGUF va fatto dove c'è rete (lo spike vivo è rimandato
# a un ambiente con connettività — vedi README "Avvio con modello reale").

services:
  web:
    image: nginx:alpine           # tier 1: solo presentazione (~5 MB)
    ports:
      #- "80:80"                    # unico punto d'ingresso per la pagina se 80 libera
      - "8090:80"                 # unico punto d'ingresso per la pagina
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/web/static:/usr/share/nginx/html:ro
    depends_on:
      - gateway

  gateway:
    build: .
    # tag espliciti bitprepared/<nome> invece dei default <progetto>-<service>,
    # così le immagini sono pronte per push/salvataggio (vedi anche skill)
    image: bitprepared/diariobot-gateway
    # nessuna porta pubblicata: la pagina passa da nginx (same-origin /api/*)
    environment:
      SKILL_URL: http://skill:8080
      LLAMA_URL: http://llama:8081
      # coder dedicato al laboratorio codice (profilo «coder»): se non è
      # attivo, la tappa code usa il modello principale (fallback dichiarato)
      CODER_URL: http://llama-coder:8082
      # finestre di contesto dichiarate ai client (-c dei due llama): il
      # contatore della pagina deve mostrare quella di CHI risponde
      LLAMA_CTX: "2048"
      CODER_CTX: "8192"
      GATEWAY_PORT: "8090"
      # Osservabilità: sessioni (sqlite3, sessions.db) persistite nel volume.
      LAB_SESSIONS_DIR: /app/sessions
      # Endpoint reale (laboratorio codice): il token vive SOLO qui, mai nel client.
      # Da laboratory/.env (gitignored, vedi .env.example); senza token il
      # selettore dei modelli remoti non compare e nulla cambia.
      HETZNER_API_KEY: ${HETZNER_API_KEY:-}
    volumes:
      - ./sessions:/app/sessions   # persistenza sessioni tra riavvii (debug a posteriori)
    command: ["python3", "-m", "backend.gateway"]
    depends_on:
      - skill

  skill:
    build: .
    image: bitprepared/diariobot-skill   # stessi layer del gateway (CMD diverso)
    ports:
      - "8080:8080"
    environment:
      # auto: usa llama se è attivo (--profile model), altrimenti mock.
      # Così basta `docker compose up` (demo) o `--profile model up` (reale).
      LAB_BACKEND: ${LAB_BACKEND:-auto}
      LLAMA_URL: http://llama:8081
      LAB_PORT: "8080"
    depends_on:
      llama:
        condition: service_healthy
        required: false   # il servizio skill parte anche senza llama (backend mock)

  llama:
    image: ghcr.io/ggml-org/llama.cpp:server
    profiles: ["model"]          # attivo solo con --profile model
    ports:
      # DECISIONE DICHIARATA (D3): 8081 è pubblicata in LAN per **consumer
      # fidati** (CLI, debug, sviluppo) che parlano OpenAI-compat diretto.
      # Non è un vincolo di rete: è una convenzione dell'applicazione — la
      # pagina del laboratorio usa SOLO il gateway (:8090/api/*), dove vivono
      # normalizzazione e osservabilità; chi bypassa le perde (LAN offline
      # fidata, niente auth).
      - "8081:8081"
    volumes:
      - ./models:/models:ro
    # Nessun --grammar-file globale: la grammatica arriva PER-REQUEST dalla skill
    # (campo "grammar" nel body). Una grammatica globale vincolerebbe anche le
    # chat libere delle tappe 1/2/4 (/api/chat) a JSON, rompendole.
    command: >
      -m /models/${MODEL_FILE:-qwen2.5-0.5b-instruct-q4_k_m.gguf}
      --host 0.0.0.0 --port 8081
      -t 4 -c 2048 --temp 0.2
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Coder dedicato al laboratorio codice (change laboratorio-code): qwen2.5-
  # coder-1.5b per generare pagine HTML+CSS complete. Parte col profilo
  # «coder» — con `make up` c'è SEMPRE (un comando, due llama); sul Pi 3 non
  # si attiva (pi-up non lo richiede: il fallback dichiarato è il main, che
  # però tronca le pagine a -c 2048). 2×~1,9 GB di peak (spike/REPORT.md):
  # il mini PC del campo (24 GB) li tiene larghi. Il gateway manda qui le
  # chat LOCALI dello step "code" quando lo vede attivo, altrimenti fallback
  # sul modello principale: nessun errore per il ragazzo. -c 8192: la pagina
  # intera ha bisogno di contesto (KV ~+250 MB su 24 GB verificati).
  # Porta NON pubblicata: è una risorsa interna, si parla solo via gateway.
  llama-coder:
    image: ghcr.io/ggml-org/llama.cpp:server
    profiles: ["coder"]
    volumes:
      - ./models:/models:ro
    command: >
      -m /models/${CODER_FILE:-qwen2.5-coder-1.5b-instruct-q4_k_m.gguf}
      --host 0.0.0.0 --port 8082
      -t 4 -c 8192 --temp 0.2
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8082/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
